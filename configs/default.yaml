# sanding-wear-tracker default configuration.
# Units: mm, N, s, MPa (= N/mm^2). k_pad in N/mm^3, K in mm^2/N (= 1/MPa), lambda in 1/mm^3.

seed: 2026

geometry:
  length_x_mm: 200.0      # straight direction (cylinder axis)
  width_y_mm: 150.0       # curved direction; > pad diameter so the pad can sit fully on the panel
  radius_mm: 300.0        # cylinder radius (convex); pad sag at its rim ~6.6 mm
  grid_mm: 1.0

pad:
  diameter_mm: 125.0
  reference_force_N: 30.0         # force at which the 5%-97% contact range is defined

sander:
  spindle_rpm: 8000.0
  orbit_diameter_mm: 5.0
  pad_spin_ratio: 0.02            # free pad rotation as a fraction of spindle speed

path:
  stepover_mm: 15.0
  station_spacing_mm: 5.0
  feed_mm_s: 25.0
  dwell_s: 0.25                   # extra time at each line end (turnaround)
  edge_margin_mm: 0.0             # pad centre runs all the way to the panel edge

schedule:
  n_passes: 20
  forces_N: [20.0, 40.0]          # cycled pass by pass (low/high alternation)
  constant_force_N: 30.0          # ablation: same mean force on every pass
  rpm: 8000.0

scan:
  noise_um: 2.0
  stride: 2                       # keep every 2nd grid node in x and y (2 mm sampling)

priors:
  # k_pad bounds chosen so contact spans ~97% (soft) to ~5% (stiff) of the pad
  # face at the reference force on the default geometry (see contact sweep).
  k_low: 6.3e-4
  k_high: 5.0
  K0_median: 6.0e-5               # mm^2/N  (6e-11 1/Pa); ~8-16 um per pass at 20-40 N when fresh
  K0_sigma_log: 0.25
  lam_median: 2.5e-4              # 1/mm^3; K < 50% K0 from pass ~12 under nominal parameters
  lam_sigma_log: 0.35
  wear_sigma_log: 0.01            # random wear fluctuation per pass (truth and filter)

abrasive:
  threshold_fraction: 0.5         # change abrasive when K < 0.5 * K0

filter:
  n_particles: 2000
  ess_fraction: 0.75              # tempering keeps ESS >= 75% of N
  mcmc_sweeps: 1                  # full-path Metropolis-Hastings sweeps after each scan
  rate_drift: auto                # random-walk s.d. of log(lambda) per pass (0 = constant wear rate);
                                  # 'auto' = chosen by the tuning experiment on held-out draws
  rate_drift_fallback: 0.1        # used by stand-alone runs before any tuning exists
  wear_noise_range: [0.005, 0.05] # log-uniform prior of the wear-fluctuation s.d. the tracker learns
  sigma_floor_um: 0.05
  surrogate_n_eta: 512
  robust: true                    # outlier rejection + noise inflation for structured residuals
  outlier_z: 5.0
  inflation_block: 4
  inflation_threshold: 1.2
  profile_offsets: true           # random offset per scan profile in the noise model (variance estimated)

# Hidden-process worlds. "matched" (always present) is the tracker's own model.
# "realistic" adds every mismatch below at once; each group is also run on its own.
worlds:
  realistic:
    pad: {kind: foam, thickness_mm: 15.0}        # foam stiffens as it densifies
    removal: {preston_exponent: 0.8}              # removal ~ p^0.8 instead of p
    force:
      gain_sigma_log: 0.04                        # per-run force-calibration error (~4%)
      ripple: 0.03                                # force-control ripple: s.d. of each raster line's force
      ripple_corr: 0.5                            # AR(1) correlation of the ripple between lines
    wear:
      kind: two_stage                             # fast break-in + slow dulling
      fast_fraction: 0.25
      fast_ratio: 6.0
      rings: 6                                    # abrasive wears ring by ring with its local work
    scan:
      registration_sigma_mm: 0.3                  # scan-to-part misalignment
      profile_bias_um: 0.5                        # per-profile offset
      outlier_fraction: 0.005
      outlier_um: 15.0
      dropout_fraction: 0.02
      dropout_gap_points: 8
      texture_um: 1.0                             # removal = difference of two height scans, each pass
      texture_corr_mm: 1.0                        # leaves a new surface texture
  # A second, harsher mismatch world, fixed (and committed) before any of its results were
  # computed; it is never used for tuning or development.
  realistic_b:
    pad: {kind: foam, thickness_mm: 10.0}
    removal: {preston_exponent: 0.7}
    force: {gain_sigma_log: 0.06, ripple: 0.05, ripple_corr: 0.7}
    wear: {kind: two_stage, fast_fraction: 0.4, fast_ratio: 4.0, rings: 6}
    scan:
      registration_sigma_mm: 0.5
      profile_bias_um: 1.0
      outlier_fraction: 0.01
      outlier_um: 20.0
      dropout_fraction: 0.05
      dropout_gap_points: 12
      texture_um: 1.5
      texture_corr_mm: 1.5

experiments:
  main_draw: typical             # 'typical' = the robustness draw at the median standardised distance from
                                  # the prior centre (uses the truths only); or an integer draw id
  main_world: realistic           # world of the headline main run (also run in the matched world)
  early_pass: 2                   # pass shown as "early" in the removal-map figure
  robustness_draws: 100           # hidden truths per robustness world
  robustness_worlds: [matched, realistic]
  validation_world: realistic_b   # the pre-registered second mismatch world
  validation_draws: 50
  ablation_world: matched         # constant-force ablation (identifiability) in the tracker's own model
  noise_world: realistic
  noise_draws: 50                 # first draws of the noise world, re-run at every noise level
  ablation_draws: 50              # first draws of the ablation world, re-run with constant force
  breakdown_draws: 40             # first draws, re-run in each single-mismatch world
  noise_levels_um: [1.0, 2.0, 5.0, 10.0]
  crossing_decision_passes: [2, 5]
  contact_sweep_k: [1.0e-4, 30.0, 121]   # log-spaced k_pad sweep: [min, max, n]

# Hyperparameter tuning on held-out draws (ids outside every experiment's range).
tuning:
  draws: [200, 220]               # [first, last + 1]
  worlds: [matched, realistic]
  rate_drift: [0.0, 0.05, 0.1, 0.15, 0.2]
